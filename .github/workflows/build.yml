name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK e Aceitar Licenças
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;32.0.0" "platforms;android-32"

      - name: Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Injetar versão automática no HTML
        run: |
          VERSION="build-${{ github.run_number }}"
          sed -i "s/AUTO_DETECT/$VERSION/g" app/src/main/assets/painel_tv.html

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Nomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jarvis-launcher.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: J.A.R.V.I.S. build #${{ github.run_number }}
          prerelease: true
          files: jarvis-launcher.apk
          body: |
            APK de teste do J.A.R.V.I.S. com deteção automática de versão.
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: jarvis-launcher.apk

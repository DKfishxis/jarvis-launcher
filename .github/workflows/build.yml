name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Nomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jarvis-launcher.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: J.A.R.V.I.S. build #${{ github.run_number }}
          prerelease: true
          files: jarvis-launcher.apk
          body: |
            APK de teste do J.A.R.V.I.S.

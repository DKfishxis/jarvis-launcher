<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Mark XLII</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d0303;
    color: #fff3d6;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    background: radial-gradient(ellipse at 50% 0%, #4a120b 0%, #240805 45%, #090304 90%);
  }

  /* ---------- Cabeçalho ---------- */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2vh 4vw 0.5vh 4vw;
    border-bottom: 0.15vh solid rgba(255, 193, 7, 0.25);
  }
  .brand {
    font-size: 3vh; letter-spacing: 0.6vh;
    color: #ffd54f;
    text-shadow: 0 0 1.5vh rgba(255, 179, 0, 0.65);
    font-weight: 600;
  }
  .brand small {
    display: block; font-size: 1.6vh; letter-spacing: .35vh;
    color: #ff5252; margin-top: .2vh; font-weight: 500;
  }
  .clock { text-align: right; font-size: 4.2vh; font-weight: 300; color: #fff8e1; }
  .clock small { display: block; font-size: 1.8vh; color: #ffca28; }

  /* ---------- Grade principal (Ocupando quase a tela toda) ---------- */
  #featured {
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    padding: 0.5vh 2vw;
    height: 88vh;
  }
  .card {
    width: 22vw; height: 38vh; margin: 1vh 1vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(155deg, rgba(211, 47, 47, 0.22), rgba(255, 179, 0, 0.12) 60%, rgba(25, 5, 5, 0.65));
    border: 0.25vh solid rgba(255, 193, 7, 0.45);
    border-radius: 2vh;
    color: inherit; font: inherit; cursor: pointer; outline: none;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }

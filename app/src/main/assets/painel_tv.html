<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Mark XXXIX</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #050b14;
    color: #e0f7fa;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    background-image: url('bg_reactor.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #050b14;
  }

  /* ---------- Cabeçalho ---------- */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2.5vh 3.5vw 0.5vh 3.5vw;
    height: 14vh;
  }
  .brand {
    font-size: 3.6vh; letter-spacing: 0.6vh;
    color: #00e5ff;
    text-shadow: 0 0 2vh rgba(0, 229, 255, 0.8);
    font-weight: 700;
  }
  .brand small {
    display: block; font-size: 1.8vh; letter-spacing: .4vh;
    color: #80f3ff; margin-top: .4vh; font-weight: 600;
  }
  
  .right-header {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .status-group {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 2.5vh;
  }

  /* Ícone de atualização no topo */
  .update-indicator {
    color: #00e5ff;
    text-shadow: 0 0 1vh rgba(0, 229, 255, 0.8);
    display: none;
    align-items: center;
  }
  .update-indicator.active {
    display: flex;
  }

  .clock-container {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .wifi-status {
    color: #00e5ff;
    text-shadow: 0 0 1vh rgba(0, 229, 255, 0.8);
    display: flex;
    align-items: center;
  }

  .clock { text-align: right; font-size: 4.5vh; font-weight: 400; color: #ffffff; text-shadow: 0 0 2vh rgba(0, 229, 255, 0.8); }
  .clock small { display: block; font-size: 2.0vh; color: #80f3ff; font-weight: 600; }

  /* ---------- Barra de Progresso de Download ---------- */
  #download-progress-container {
    display: none;
    position: fixed;
    top: 14vh;
    left: 3.5vw;
    right: 3.5vw;
    background: rgba(5, 15, 30, 0.9);
    border: 0.2vh solid rgba(0, 229, 255, 0.5);
    border-radius: 1vh;
    padding: 1.5vh 2vw;
    z-index: 100;
    box-shadow: 0 0 2vh rgba(0, 229, 255, 0.4);
  }
  #download-progress-container.open { display: block; }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 1.8vh;
    color: #00e5ff;
    margin-bottom: 0.8vh;
    font-weight: 600;
    letter-spacing: 0.1vh;
  }
  .progress-bar-bg {
    width: 100%;
    height: 1.2vh;
    background: rgba(0, 229, 255, 0.15);
    border-radius: 0.6vh;
    overflow: hidden;
    border: 0.1vh solid rgba(0, 229, 255, 0.3);
  }
  #progress-bar-fill {
    width: 0%;
    height: 100%;
    background: #00e5ff;
    box-shadow: 0 0 1vh rgba(0, 229, 255, 0.9);
    transition: width 0.3s ease;
  }

  /* ---------- Grade principal retangular ---------- */
  #featured {
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    padding: 1vh 2vw;
    height: 83vh;
  }
  .card {
    width: 21vw; height: 36vh; margin: 0.8vh 1vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(155deg, rgba(0, 229, 255, 0.15), rgba(5, 25, 45, 0.75) 60%, rgba(2, 8, 15, 0.85));
    border: 0.25vh solid rgba(0, 229, 255, 0.4);
    border-radius: 1.8vh;
    color: inherit; font: inherit; cursor: pointer; outline: none;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card .icon {
    width: 14vh; height: 14vh; object-fit: contain; border-radius: 2vh;
    display: flex; align-items: center; justify-content: center;
    font-size: 6vh; color: #00e5ff;
  }
  .card .label {
    margin-top: 1.5vh; font-size: 2.4vh; letter-spacing: .15vh;
    color: #ffffff;
    text-shadow: 0 0.2vh 0.6vh rgba(0, 0, 0, 0.9);
  }
  .card.missing { opacity: .55; }
  .card.missing .label::after { content: " (não instalado)"; font-size: 1.5vh; color: #ff8a80; }

  .card:focus, .tile:focus {
    border-color: #00e5ff;
    box-shadow: 0 0 4vh rgba(0, 229, 255, 1), inset 0 0 2.5vh rgba(0, 229, 255, 0.5);
    -webkit-transform: scale(1.05); transform: scale(1.05);
    background: linear-gradient(155deg, rgba(0, 229, 255, 0.35), rgba(5, 45, 80, 0.8));
  }

  /* ---------- Gaveta "Todos os Apps" ---------- */
  #drawer {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(4, 25, 45, 0.98) 0%, rgba(2, 8, 15, 0.99) 85%);
    z-index: 10;
    overflow-y: auto; padding: 3vh 3vw 6vh 3vw;
  }
  #drawer.open { display: block; }
  #drawer h2 {
    margin: 0 0 1vh 1vw; font-size: 2.8vh; letter-spacing: .4vh;
    color: #00e5ff; font-weight: 600;
  }
  #drawer .hint { font-size: 1.6vh; color: #80f3ff; margin-left: 1vw; }
  #grid { display: flex; flex-wrap: wrap; margin-top: 2vh; }
  .tile {
    width: 14vw; height: 21vh; margin: 0.8vh 0.8vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(0, 229, 255, 0.12), rgba(5, 20, 35, 0.7));
    border: 0.2vh solid rgba(0, 229, 255, 0.3); border-radius: 1.5vh;
    color: inherit; font: inherit; cursor: pointer; outline: none; padding: 1vh;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .tile img { width: 8.5vh; height: 8.5vh; object-fit: contain; }
  .tile span {
    margin-top: 1.2vh; font-size: 1.8vh; text-align: center; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #ffffff;
  }
  #empty { display: none; margin: 4vh 1vw; color: #ffab91; font-size: 2.2vh; }
</style>
</head>
<body>

<header>
  <div class="brand">J.A.R.V.I.S.<small>MARK XXXIX - GEMINI</small></div>
  <div class="right-header">
    <div class="status-group">
      <div id="update-badge" class="update-indicator" title="Atualização Disponível">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </div>
    </div>
    <div class="clock-container">
      <div id="wifi-indicator" class="wifi-status" title="Conectado">
        <!-- Ícone dinâmico estilo One UI 7 injetado via script -->
      </div>
      <div class="clock"><span id="time">--:--</span><small id="date"></small></div>
    </div>
  </div>
</header>

<div id="download-progress-container">
  <div class="progress-info">
    <span id="progress-text">A transferir atualização do sistema...</span>
    <span id="progress-percent">0%</span>
  </div>
  <div class="progress-bar-bg">
    <div id="progress-bar-fill"></div>
  </div>
</div>

<div id="featured"></div>

<div id="drawer">
  <h2>TODOS OS APPS & SISTEMA</h2>
  <div class="hint">Use o controle para navegar · Voltar fecha a gaveta</div>
  <div id="empty">Nenhum app encontrado.</div>
  <div id="grid"></div>
</div>

<script>
(function () {
  var CURRENT_VERSION = 'AUTO_DETECT';

  var FEATURED = [
    { pkg: 'com.unitvnet.tvod',                name: 'UniTV' },
    { pkg: 'com.google.android.youtube.tv',    name: 'YouTube' },
    { pkg: 'com.instantbits.cast.receiver',    name: 'Web Video Cast' },
    { pkg: 'com.kick.mobile',                  name: 'Kick' },
    { pkg: 'tv.twitch.android.app',            name: 'Twitch' },
    { pkg: 'com.android.vending',              name: 'Play Store' },
    { pkg: 'com.android.tv.settings',          name: 'Configurações' }
  ];

  var featuredEl = document.getElementById('featured');
  var drawerEl = document.getElementById('drawer');
  var gridEl = document.getElementById('grid');
  var emptyEl = document.getElementById('empty');
  var hasBridge = (typeof window.Jarvis !== 'undefined');
  var allBtn = null;

  window.triggerUpdate = function() {
    var progressContainer = document.getElementById('download-progress-container');
    var progressFill = document.getElementById('progress-bar-fill');
    var progressPercent = document.getElementById('progress-percent');
    var progressText = document.getElementById('progress-text');
    
    progressContainer.classList.add('open');
    progressFill.style.width = '0%';
    progressPercent.textContent = '0%';

    var updateUrl = 'https://github.com/DKfishxis/jarvis-launcher/releases/latest/download/jarvis-launcher.apk';

    if (hasBridge && window.Jarvis.downloadAndInstall) {
      window.Jarvis.downloadAndInstall(updateUrl);
    } else {
      window.location.href = updateUrl;
    }

    var simulatedProgress = 0;
    var interval = setInterval(function() {
      simulatedProgress += 3;
      if (simulatedProgress > 95) simulatedProgress = 95;
      progressFill.style.width = simulatedProgress + '%';
      progressPercent.textContent = simulatedProgress + '%';
      if (simulatedProgress >= 95) {
        clearInterval(interval);
      }
    }, 200);
  };

  window.onDownloadComplete = function() {
    var progressFill = document.getElementById('progress-bar-fill');
    var progressPercent = document.getElementById('progress-percent');
    var progressText = document.getElementById('progress-text');
    var progressContainer = document.getElementById('download-progress-container');

    progressFill.style.width = '100%';
    progressPercent.textContent = '100%';
    progressText.textContent = 'Download concluído! A iniciar instalador...';

    setTimeout(function() {
      progressContainer.classList.remove('open');
    }, 3000);
  };

  function checkUpdates() {
    var badge = document.getElementById('update-badge');
    if (CURRENT_VERSION === 'AUTO_DETECT') return;

    fetch('https://api.github.com/repos/DKfishxis/jarvis-launcher/releases/latest')
      .then(function(response) {
        if (!response.ok) throw new Error('Erro ao verificar atualizações');
        return response.json();
      })
      .then(function(data) {
        if (data && data.tag_name && data.tag_name !== CURRENT_VERSION) {
          badge.classList.add('active');
        }
      })
      .catch(function(err) {
        console.log('Verificação de update falhou:', err);
      });
  }
  checkUpdates();

  function updateNetworkStatus() {
    var wifiEl = document.getElementById('wifi-indicator');
    var online = navigator.onLine;
    
    if (!online) {
      // Estado: Sem conexão total (Mostra o Wi-Fi com um "X")
      wifiEl.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ff5252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><path d="M5 12.859a10 10 0 0 1 14 0"></path><line x1="4" y1="4" x2="20" y2="20"></line></svg>';
      wifiEl.title = 'Sem Conexão';
    } else {
      // Estado Padrão One UI 7: Wi-Fi 5 com setinhas (↓↑) de tráfego ativas
      wifiEl.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><path d="M5 12.859a10 10 0 0 1 14 0"></path><path d="M15 14l-3 3-3-3"></path><path d="M12 17v-6"></path><text x="17" y="8" font-size="7" fill="#00e5ff" stroke="none" font-weight="bold">5</text></svg>';
      wifiEl.title = 'Conectado (Wi-Fi 5)';

      // Valida se está conectado à rede mas sem acesso à internet real (Exclamação no lugar das setas)
      fetch('https://api.github.com/repos/DKfishxis/jarvis-launcher/releases/latest', { method: 'HEAD', mode: 'no-cors' })
        .catch(function() {
          wifiEl.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffab91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><path d="M5 12.859a10 10 0 0 1 14 0"></path><line x1="12" y1="13" x2="12" y2="15"></line><circle cx="12" cy="17.5" r="0.75" fill="#ffab91"></circle><text x="17" y="8" font-size="7" fill="#ffab91" stroke="none" font-weight="bold">5</text></svg>';
          wifiEl.title = 'Conectado sem Internet';
        });
    }
  }

  function tick() {
    var d = new Date();
    var hh = ('0' + d.getHours()).slice(-2), mm = ('0' + d.getMinutes()).slice(-2);
    document.getElementById('time').textContent = hh + ':' + mm;
    document.getElementById('date').textContent =
      d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
    updateNetworkStatus();
  }
  tick(); setInterval(tick, 5000);

  function launch(pkg) {
    if (hasBridge) { window.Jarvis.launchApp(pkg); }
    else { window.location.href = 'jarvis://app/' + encodeURIComponent(pkg); }
  }

  function makeIconNode(src, name) {
    if (src && src.startsWith('data:image')) {
      var img = document.createElement('img');
      img.className = 'icon';
      img.src = src;
      img.alt = name;
      return img;
    }
    var ph = document.createElement('div');
    ph.className = 'icon';
    ph.style.cssText = 'width:14vh; height:14vh; display:flex; align-items:center; justify-content:center; font-size:6vh; color:#00e5ff;';
    ph.textContent = (name || '?').charAt(0);
    return ph;
  }

  function renderFeatured(data) {
    var byPkg = {};
    (data || []).forEach(function (f) { byPkg[f.pkg] = f; });
    var hadFocus = document.activeElement && document.activeElement.getAttribute('data-pkg');
    featuredEl.innerHTML = '';

    FEATURED.forEach(function (app) {
      var info = byPkg[app.pkg];
      var btn = document.createElement('button');
      btn.className = 'card focusable';
      btn.setAttribute('data-pkg', app.pkg);
      if (info && info.installed === false) btn.classList.add('missing');
      
      var iconSrc = info ? info.icon : null;
      btn.appendChild(makeIconNode(iconSrc, app.name));

      var lb = document.createElement('div');
      lb.className = 'label'; 
      lb.textContent = app.name;
      btn.appendChild(lb);
      
      btn.onclick = function () { launch(app.pkg); };
      featuredEl.appendChild(btn);
    });

    allBtn = document.createElement('button');
    allBtn.className = 'card all focusable';
    allBtn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="#00e5ff" style="width:7vh; height:7vh;"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>' +
      '<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>' +
      '<circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>' +
      '<div class="label">Todos os Apps</div>';
    allBtn.onclick = openDrawer;
    featuredEl.appendChild(allBtn);

    if (!drawerEl.classList.contains('open')) {
      var restore = hadFocus && featuredEl.querySelector('[data-pkg="' + hadFocus + '"]');
      (restore || featuredEl.querySelector('.focusable')).focus();
    }
  }

  function renderAll(list) {
    gridEl.innerHTML = '';
    emptyEl.style.display = (list && list.length) ? 'none' : 'block';

    var updateTile = document.createElement('button');
    updateTile.className = 'tile focusable';
    updateTile.innerHTML = '<div style="font-size:5vh; color:#00e5ff; display:flex; align-items:center; justify-content:center; height:8.5vh;">📥</div><span>Atualizar Sistema</span>';
    updateTile.onclick = triggerUpdate;
    gridEl.appendChild(updateTile);

    (list || []).forEach(function (app) {
      var t = document.createElement('button');
      t.className = 'tile focusable';
      
      if (app.icon && app.icon.startsWith('data:image')) {
        var img = document.createElement('img');
        img.src = app.icon;
        t.appendChild(img);
      } else {
        var ph = document.createElement('div');
        ph.className = 'icon';
        ph.style.cssText = 'width:8.5vh; height:8.5vh; display:flex; align-items:center; justify-content:center; font-size:4vh; color:#00e5ff;';
        ph.textContent = (app.name || '?').charAt(0);
        t.appendChild(ph);
      }

      var sp = document.createElement('span');
      sp.textContent = app.name;
      t.appendChild(sp);
      
      t.onclick = function () { launch(app.pkg); };
      gridEl.appendChild(t);
    });
  }

  function openDrawer() {
    drawerEl.classList.add('open');
    var first = gridEl.querySelector('.focusable');
    if (first) first.focus();
  }
  
  function closeDrawer() {
    drawerEl.classList.remove('open');
    if (allBtn) allBtn.focus();
  }

  window.onAppsLoaded = function (payload) {
    renderFeatured(payload.featured);
    var wasOpen = drawerEl.classList.contains('open');
    renderAll(payload.all);
    if (wasOpen) { var f = gridEl.querySelector('.focusable'); if (f) f.focus(); }
  };
  
  window.jarvisBack = function () {
    if (drawerEl.classList.contains('open')) closeDrawer();
  };
  
  window.jarvisRefresh = function () { requestApps(); };

  function requestApps() {
    if (hasBridge) {
      var pkgs = FEATURED.map(function (a) { return a.pkg; });
      window.Jarvis.requestApps(JSON.stringify(pkgs));
    }
  }

  function scope() { return drawerEl.classList.contains('open') ? drawerEl : featuredEl; }

  function move(dir) {
    var list = [].slice.call(scope().querySelectorAll('.focusable'));
    if (!list.length) return;
    var cur = document.activeElement;
    if (list.indexOf(cur) < 0) { list[0].focus(); return; }
    var r = cur.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var best = null, bestScore = 1e9;
    list.forEach(function (el) {
      if (el === cur) return;
      var b = el.getBoundingClientRect();
      var dx = (b.left + b.width / 2) - cx, dy = (b.top + b.height / 2) - cy;
      var main, cross;
      if (dir === 'left')  { main = -dx; cross = Math.abs(dy); }
      if (dir === 'right') { main =  dx; cross = Math.abs(dy); }
      if (dir === 'up')    { main = -dy; cross = Math.abs(dx); }
      if (dir === 'down')  { main =  dy; cross = Math.abs(dx); }
      if (main <= 5) return;
      var score = main + cross * 2.5;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) best.focus();
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (k === 37) { move('left');  e.preventDefault(); }
    else if (k === 39) { move('right'); e.preventDefault(); }
    else if (k === 38) { move('up');    e.preventDefault(); }
    else if (k === 40) { move('down');  e.preventDefault(); }
    else if (k === 13 || k === 23) {
      var el = document.activeElement;
      if (el && el.classList.contains('focusable')) { el.click(); e.preventDefault(); }
    }
    else if (k === 27 || k === 8) { window.jarvisBack(); e.preventDefault(); }
  });

  renderFeatured([]);
  requestApps();
})();
</script>
</body>
</html>

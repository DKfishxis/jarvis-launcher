<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Mark XLII</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d0303;
    color: #fff3d6;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    background: radial-gradient(ellipse at 50% 0%, #4a120b 0%, #240805 45%, #090304 90%);
    display: flex; flex-direction: column;
  }

  /* ---------- Cabeçalho ---------- */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.5vh 3vw;
    border-bottom: 0.15vh solid rgba(255, 193, 7, 0.25);
    background: rgba(10, 2, 3, 0.6);
  }
  .brand-area { display: flex; align-items: center; gap: 1.5vw; }
  .reactor-icon {
    width: 3.5vh; height: 3.5vh; border-radius: 50%;
    background: radial-gradient(circle, #00e5ff 0%, #007acc 70%, #001a33 100%);
    box-shadow: 0 0 1.5vh #00e5ff;
  }
  .brand {
    font-size: 2.6vh; letter-spacing: 0.4vh;
    color: #ffd54f;
    text-shadow: 0 0 1.2vh rgba(255, 179, 0, 0.65);
    font-weight: 600;
  }
  .brand small {
    display: block; font-size: 1.3vh; letter-spacing: .25vh;
    color: #00e5ff; margin-top: .1vh; font-weight: 500;
  }
  .clock { text-align: right; font-size: 3.2vh; font-weight: 300; color: #fff8e1; }
  .clock small { display: block; font-size: 1.4vh; color: #ffca28; }

  /* ---------- Corpo do Painel com Seções ---------- */
  #main-container {
    flex: 1; padding: 2vh 3vw;
    overflow-y: auto; display: flex; flex-direction: column; gap: 2vh;
  }
  .section-title {
    font-size: 1.8vh; letter-spacing: 0.3vh; color: #00e5ff;
    text-shadow: 0 0 1vh rgba(0, 229, 255, 0.5);
    margin-bottom: 1vh; display: flex; align-items: center; gap: 1vw;
    font-weight: 600; border-left: 0.4vh solid #00e5ff; padding-left: 1vw;
  }
  .grid-section {
    display: flex; flex-wrap: wrap; gap: 1.5vw;
  }

  /* ---------- Cards dos Apps ---------- */
  .card {
    width: 45vw; height: 11vh; 
    display: flex; align-items: center; padding: 0 2vw;
    background: linear-gradient(135deg, rgba(211, 47, 47, 0.18), rgba(25, 5, 5, 0.8));
    border: 0.22vh solid rgba(255, 193, 7, 0.35);
    border-radius: 1.5vh;
    color: inherit; font: inherit; cursor: pointer; outline: none;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .card .icon {
    width: 6.5vh; height: 6.5vh; object-fit: contain; border-radius: 1.2vh;
    display: flex; align-items: center; justify-content: center;
    font-size: 4vh; color: #ffd54f; flex-shrink: 0;
  }
  .card .label {
    margin-left: 2vw; font-size: 2.2vh; letter-spacing: .1vh;
    color: #fff8e1; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card.missing { opacity: .55; }
  .card.missing .label::after { content: " (não instalado)"; font-size: 1.4vh; color: #ff8a80; }

  /* Foco do controle (estilo Reator Arc + Dourado) */
  .card:focus, .tile:focus {
    border-color: #00e5ff;
    box-shadow: 0 0 2.5vh rgba(0, 229, 255, 0.8), inset 0 0 1.5vh rgba(255, 193, 7, 0.3);
    -webkit-transform: scale(1.03); transform: scale(1.03);
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.25), rgba(40, 10, 15, 0.9));
  }
  .card.all svg { width: 6.5vh; height: 6.5vh; fill: #00e5ff; }

  /* ---------- Gaveta "Todos os Apps" ---------- */
  #drawer {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(55, 12, 8, 0.98) 0%, rgba(12, 3, 4, 0.99) 85%);
    z-index: 10;
    overflow-y: auto; padding: 3vh 3vw 6vh 3vw;
  }
  #drawer.open { display: block; }
  #drawer h2 {
    margin: 0 0 1vh 1vw; font-size: 2.8vh; letter-spacing: .4vh;
    color: #ffd54f; font-weight: 500;
  }
  #drawer .hint { font-size: 1.6vh; color: #ffab91; margin-left: 1vw; }
  #grid { display: flex; flex-wrap: wrap; margin-top: 2vh; gap: 1vw; }
  .tile {
    width: 22vw; height: 16vh; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(183, 28, 28, 0.18), rgba(255, 179, 0, 0.08));
    border: 0.2vh solid rgba(255, 193, 7, 0.3); border-radius: 1.5vh;
    color: inherit; font: inherit; cursor: pointer; outline: none; padding: 1vh;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .tile img { width: 7vh; height: 7vh; object-fit: contain; }
  .tile span {
    margin-top: 1vh; font-size: 1.6vh; text-align: center; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #fff8e1;
  }
  #empty { display: none; margin: 4vh 1vw; color: #ffab91; font-size: 2.2vh; }
</style>
</head>
<body>

<header>
  <div class="brand-area">
    <div class="reactor-icon"></div>
    <div class="brand">MARK XLII — CENTRAL TV<small>SISTEMA J.A.R.V.I.S. ATIVO</small></div>
  </div>
  <div class="clock"><span id="time">--:--</span><small id="date"></small></div>
</header>

<div id="main-container">
  <div class="section-title">⚡ PLATAFORMAS DE LIVE & VÍDEO</div>
  <div class="grid-section" id="section-live"></div>

  <div class="section-title" id="title-system" style="margin-top: 1vh;">🛡️ CONTROLE DO SISTEMA</div>
  <div class="grid-section" id="section-system"></div>
</div>

<div id="drawer">
  <h2>TODOS OS APPS</h2>
  <div class="hint">Use o controle para navegar · Voltar fecha a gaveta</div>
  <div id="empty">Nenhum app encontrado.</div>
  <div id="grid"></div>
</div>

<script>
(function () {
  // Apps divididos nas seções exatas da sua foto
  var LIVE_APPS = [
    { pkg: 'com.kick.mobile',                  name: 'Kick' },
    { pkg: 'tv.twitch.android.app',            name: 'Twitch' },
    { pkg: 'com.google.android.youtube.tv',    name: 'YouTube' },
    { pkg: 'comunitvnet.tvvod',               name: 'UniTV' },
    { pkg: 'com.instantbits.cast.receiver',    name: 'Web Video Cast' }
  ];

  var SYSTEM_APPS = [
    { pkg: 'all_apps',                         name: 'Meus Apps Instalados', isSpecial: true },
    { pkg: 'com.android.settings',             name: 'Configurações' }
  ];

  var liveEl = document.getElementById('section-live');
  var systemEl = document.getElementById('section-system');
  var drawerEl = document.getElementById('drawer');
  var gridEl = document.getElementById('grid');
  var emptyEl = document.getElementById('empty');
  var hasBridge = (typeof window.Jarvis !== 'undefined');
  var allBtn = null;

  function tick() {
    var d = new Date();
    var hh = ('0' + d.getHours()).slice(-2), mm = ('0' + d.getMinutes()).slice(-2);
    document.getElementById('time').textContent = hh + ':' + mm;
    document.getElementById('date').textContent =
      d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  }
  tick(); setInterval(tick, 10000);

  function launch(pkg) {
    if (hasBridge) { window.Jarvis.launchApp(pkg); }
    else { window.location.href = 'jarvis://app/' + encodeURIComponent(pkg); }
  }

  function makeIconNode(src, name) {
    if (src) {
      var img = document.createElement('img');
      img.className = 'icon'; img.src = src; img.alt = name;
      return img;
    }
    var ph = document.createElement('div');
    ph.className = 'icon'; ph.textContent = name.charAt(0);
    return ph;
  }

  function renderFeatured(data) {
    var byPkg = {};
    (data || []).forEach(function (f) { byPkg[f.pkg] = f; });
    var hadFocus = document.activeElement && document.activeElement.getAttribute('data-pkg');
    liveEl.innerHTML = '';
    systemEl.innerHTML = '';

    // Renderiza seção Live & Vídeo
    LIVE_APPS.forEach(function (app) {
      var info = byPkg[app.pkg];
      var btn = document.createElement('button');
      btn.className = 'card focusable';
      btn.setAttribute('data-pkg', app.pkg);
      if (info && info.installed === false) btn.classList.add('missing');
      btn.appendChild(makeIconNode(info && info.icon, app.name));
      var lb = document.createElement('div');
      lb.className = 'label'; lb.textContent = app.name;
      btn.appendChild(lb);
      btn.onclick = function () { launch(app.pkg); };
      liveEl.appendChild(btn);
    });

    // Renderiza seção Sistema (incluindo o botão "Meus Apps Instalados")
    SYSTEM_APPS.forEach(function (app) {
      var btn = document.createElement('button');
      btn.setAttribute('data-pkg', app.pkg);
      if (app.isSpecial) {
        btn.className = 'card all focusable';
        btn.innerHTML =
          '<div class="icon"><svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>' +
          '<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>' +
          '<circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg></div>' +
          '<div class="label">' + app.name + '</div>';
        btn.onclick = openDrawer;
        allBtn = btn;
      } else {
        var info = byPkg[app.pkg];
        btn.className = 'card focusable';
        if (info && info.installed === false) btn.classList.add('missing');
        btn.appendChild(makeIconNode(info && info.icon, app.name));
        var lb = document.createElement('div');
        lb.className = 'label'; lb.textContent = app.name;
        btn.appendChild(lb);
        btn.onclick = function () { launch(app.pkg); };
      }
      systemEl.appendChild(btn);
    });

    if (!drawerEl.classList.contains('open')) {
      var restore = hadFocus && document.querySelector('[data-pkg="' + hadFocus + '"]');
      (restore || document.querySelector('.focusable')).focus();
    }
  }

  function renderAll(list) {
    gridEl.innerHTML = '';
    emptyEl.style.display = (list && list.length) ? 'none' : 'block';
    (list || []).forEach(function (app) {
      var t = document.createElement('button');
      t.className = 'tile focusable';
      var img = document.createElement('img');
      if (app.icon) img.src = app.icon;
      var sp = document.createElement('span');
      sp.textContent = app.name;
      t.appendChild(img); t.appendChild(sp);
      t.onclick = function () { launch(app.pkg); };
      gridEl.appendChild(t);
    });
  }

  function openDrawer() {
    drawerEl.classList.add('open');
    var first = gridEl.querySelector('.focusable');
    if (first) first.focus();
  }
  function closeDrawer() {
    drawerEl.classList.remove('open');
    if (allBtn) allBtn.focus();
  }

  window.onAppsLoaded = function (payload) {
    var allFeaturedPkgs = LIVE_APPS.concat(SYSTEM_APPS)
      .filter(function(a) { return !a.isSpecial; })
      .map(function(a) { return a.pkg; });
    
    // Filtra dados recebidos
    renderFeatured(payload.featured);
    var wasOpen = drawerEl.classList.contains('open');
    renderAll(payload.all);
    if (wasOpen) { var f = gridEl.querySelector('.focusable'); if (f) f.focus(); }
  };

  window.jarvisBack = function () {
    if (drawerEl.classList.contains('open')) closeDrawer();
  };
  window.jarvisRefresh = function () { requestApps(); };

  function requestApps() {
    if (hasBridge) {
      var pkgs = LIVE_APPS.concat(SYSTEM_APPS)
        .filter(function(a) { return !a.isSpecial; })
        .map(function(a) { return a.pkg; });
      window.Jarvis.requestApps(JSON.stringify(pkgs));
    }
  }

  function scope() { return drawerEl.classList.contains('open') ? drawerEl : featuredEl; }

  function move(dir) {
    var list = [].slice.call(document.querySelectorAll((drawerEl.classList.contains('open') ? '#drawer' : '#main-container') + ' .focusable'));
    if (!list.length) return;
    var cur = document.activeElement;
    if (list.indexOf(cur) < 0) { list[0].focus(); return; }
    var r = cur.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var best = null, bestScore = 1e9;
    list.forEach(function (el) {
      if (el === cur) return;
      var b = el.getBoundingClientRect();
      var dx = (b.left + b.width / 2) - cx, dy = (b.top + b.height / 2) - cy;
      var main, cross;
      if (dir === 'left')  { main = -dx; cross = Math.abs(dy); }
      if (dir === 'right') { main =  dx; cross = Math.abs(dy); }
      if (dir === 'up')    { main = -dy; cross = Math.abs(dx); }
      if (dir === 'down')  { main =  dy; cross = Math.abs(dx); }
      if (main <= 5) return;
      var score = main + cross * 2.5;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) best.focus();
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (k === 37) { move('left');  e.preventDefault(); }
    else if (k === 39) { move('right'); e.preventDefault(); }
    else if (k === 38) { move('up');    e.preventDefault(); }
    else if (k === 40) { move('down');  e.preventDefault(); }
    else if (k === 13 || k === 23) {
      var el = document.activeElement;
      if (el && el.classList.contains('focusable')) { el.click(); e.preventDefault(); }
    }
    else if (k === 27 || k === 8) { window.jarvisBack(); e.preventDefault(); }
  });

  renderFeatured([]);
  requestApps();
})();
</script>
</body>
</html>
